apiVersion: apps/v1
kind: Deployment                                                                                                                     metadata:
  name: frontend                                                                                                                       namespace: mern                                                                                                                      labels:                                                                                                                                role: frontend:wq
  spec:                                                                                                                                  replicas: 1                                                                                                                          strategy:
    type: RollingUpdate                                                                                                                  rollingUpdate:                                                                                                                         maxSurge: 1
      maxUnavailable: 25%                                                                                                              selector:                                                                                                                              matchLabels:
      role: frontend                                                                                                                   template:                                                                                                                              metadata:                                                                                                                              labels:
        role: frontend                                                                                                                   spec:
      containers:                                                                                                                          - name: frontend
        image: ritvik115/frontend:latest3
        imagePullPolicy: Always                                                                                                              env:
          - name: REACT_APP_BACKEND_URL
            value: "http://172.210.136.150:32000"
        ports:
        - containerPort: 3000
